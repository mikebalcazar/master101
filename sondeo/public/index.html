<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sondeos 101</title>
<style>
:root{--bg:#f3f6f8;--fg:#14222c;--muted:#5b6b77;--azul:#0381c2;--line:#d6dee4;--panel:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d161c;--fg:#e4edf2;--muted:#93a5b1;--azul:#3aa3dc;--line:#26363f;--panel:#15222b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px;display:grid;gap:14px}
h1{margin:0;font-size:1.7rem}
p{margin:0;color:var(--muted)}
a.sondeo{display:block;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none}
a.sondeo b{display:block;font-size:1.1rem}
a.sondeo:hover{border-color:var(--azul)}
</style>
</head>
<body>
<main>
  <h1>Sondeos 101</h1>
  <p>Lo que hay que decidir de la suite, para marcarlo con calma.</p>
  <a class="sondeo" href="/iconos/"><b>Íconos de la suite</b><span>Cinco opciones de ícono por app. 9-oct-2026.</span></a>
</main>
</body>
</html>
