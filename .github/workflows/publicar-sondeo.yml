# Publica sondeo101 (sondeo.taller101.com) y mide lo que publicó.
#
# Es un Worker aparte que vive en este repo porque aquí están los secretos
# con que se publica (los mismos de master101). Lo marcado va a la D1
# `sondeo101`; la de staging es `sondeo101-staging`. Las dos las creó el chat
# con el MCP de Cloudflare (esquema en sondeo/esquema.sql).
#
# Orden: staging → medición con escritura (sondeo `prueba-humo`) → la hoja
# de íconos manejada con un navegador → producción → medición de producción
# (sólo lee: ahí contesta Mike).

name: Publicar sondeo

on:
  push:
    branches: [main]
    paths:
      - 'sondeo/**'
      - '.github/workflows/publicar-sondeo.yml'
  workflow_dispatch:

permissions:
  contents: write          # para dejar el comentario en el commit

concurrency:
  group: despliegue-sondeo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Comprobar que hay con qué publicar
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && { echo "los dos secretos están puestos"; exit 0; }
          echo "FALTA CON QUÉ PUBLICAR: los secretos de Cloudflare de master101" | tee /tmp/medido-staging.txt
          exit 1

      - name: Que el JavaScript compile
        run: node --check sondeo/worker.js && node --check sondeo/medir.mjs && node --check sondeo/navegador.mjs

      - name: Publicar staging
        id: staging
        run: |
          set -euo pipefail
          npx wrangler deploy -c sondeo/wrangler.toml --env staging | tee /tmp/staging.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/staging.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Medir staging
        env:
          BASE: ${{ steps.staging.outputs.url }}
        run: |
          set -u
          exec > >(tee /tmp/medido-staging.txt) 2>&1
          echo "== staging: $BASE =="
          for i in 1 2 3 4 5 6; do curl -sf -o /dev/null "$BASE/" && break; sleep 5; done
          node sondeo/medir.mjs --escribir

      - name: Traer el navegador
        run: npx playwright install --with-deps chromium

      - name: La hoja de íconos manejada con un navegador, contra staging
        env:
          BASE: ${{ steps.staging.outputs.url }}
        run: |
          set -u
          exec > >(tee /tmp/medido-navegador.txt) 2>&1
          echo "== navegador contra staging =="
          node sondeo/navegador.mjs

      - name: Publicar producción
        run: |
          set -euo pipefail
          npx wrangler deploy -c sondeo/wrangler.toml | tee /tmp/prod.txt

      - name: Medir producción
        run: |
          set -u
          exec > >(tee /tmp/medido-prod.txt) 2>&1
          echo "== producción: https://sondeo.taller101.com =="
          for i in $(seq 1 24); do curl -sf -o /dev/null https://sondeo.taller101.com/ && break; sleep 5; done
          BASE=https://sondeo.taller101.com node sondeo/medir.mjs

      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          : > /tmp/salida.txt
          for f in /tmp/medido-staging.txt /tmp/medido-navegador.txt /tmp/medido-prod.txt; do
            [ -f "$f" ] && cat "$f" >> /tmp/salida.txt
          done
          [ -s /tmp/salida.txt ] || echo "No hubo salida que reportar: el flujo se cayó antes de medir." > /tmp/salida.txt
          jq -Rs '{body: ("**sondeo101**\n\n```\n" + .[-60000:] + "\n```")}' /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /dev/null -w 'comentario: %{http_code}\n'
